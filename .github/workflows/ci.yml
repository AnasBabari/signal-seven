name: Signal Seven CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, overhaul/volatility-forecasting]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv and lockfile-verified backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir uv==0.11.16
          uv lock --project backend --check
          uv sync --project backend --locked --no-install-project
      - name: Install CPU PyTorch for research tests
        run: uv pip install --python backend/.venv/bin/python "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify research test runtime
        run: backend/.venv/bin/python -c "import torch; assert torch.version.cuda is None; print('CPU PyTorch', torch.__version__); import onnxruntime; print('ONNX Runtime', onnxruntime.__version__)"
      - name: Ruff Check
        run: backend/.venv/bin/ruff check .
      - name: Ruff Format Check
        run: backend/.venv/bin/ruff format --check .
      - name: Bandit Security Check
        run: backend/.venv/bin/bandit -r backend -x backend/tests,backend/venv,backend/.venv -ll
      - name: Mypy Core Check
        run: backend/.venv/bin/mypy --config-file backend/pyproject.toml backend/api.py backend/config.py backend/calendars.py backend/routes/health.py backend/routes/common.py backend/routes/simple_forecast.py
      - name: Mypy Full Advisory Check
        continue-on-error: true
        run: backend/.venv/bin/mypy --config-file backend/pyproject.toml backend --exclude '(venv|\.venv|tests)'
      - name: Run Backend & Research Tests
        run: backend/.venv/bin/pytest -c backend/pyproject.toml backend/tests research/tests -q -ra

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run Frontend Tests
        run: npm test -- --run
        working-directory: frontend
      - name: Build Frontend Bundle
        run: npm run build
        working-directory: frontend
      - name: Verify Production Bundle Ceilings
        run: npm run check:production-bundle
        working-directory: frontend
      - name: Install browser contract runtime
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify public UI contracts with local fixtures
        run: npm run e2e -- e2e/server-contract.spec.js e2e/audit-contract.spec.js
        working-directory: frontend
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-contract-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
