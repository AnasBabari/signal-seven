version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are SHA-pinned per check_ci_policy.py; Dependabot updates the
    # pin together with the version comment.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # uv.lock is the canonical resolution; Dependabot updates pyproject.toml
    # and backend/uv.lock together so `uv lock --check` stays green.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Keep peer-locked frontend ecosystems aligned across major, minor, and patch
    # updates so Dependabot does not open broken split PRs (e.g. vitest without
    # @vitest/coverage-v8, or react without react-dom and @types/react-dom).
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
